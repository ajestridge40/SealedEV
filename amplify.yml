# AWS Amplify Hosting build settings (picked up automatically from the repo root).
version: 1
frontend:
  phases:
    preBuild:
      commands:
        - nvm install 22 && nvm use 22
        - npm ci
    build:
      commands:
        # Amplify only exposes env vars at build time; the Next.js server reads
        # them at runtime from .env.production, so copy the ones it needs.
        - env | grep -E '^(DATABASE_URL|DIRECT_URL|AUTH_SECRET|AUTH_URL|ADMIN_EMAILS|CRON_SECRET|ENABLE_TCGCSV|ENABLE_SCRYFALL|POKEMONTCG_API_KEY)=' >> .env.production
        - npx prisma migrate deploy
        - npm run build
  artifacts:
    baseDirectory: .next
    files:
      - "**/*"
  cache:
    paths:
      - .next/cache/**/*
      - node_modules/**/*
